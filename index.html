<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Damilola Odumosu (d-odumosu)</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
  <main id="episodes">
    <label for="search">search episodes:</label>
    <input type="text" id="search" />
    <p id="episode-count"></p>

    <label for="episode-select">Jump to an episode:</label>
<select id="episode-select">
  <option value="">Select an episode</option>
</select>
      <template id="episode-template">
        <article class="episode-card">
          <h3 class="episode-title"></h3>
          <img class="episode-image"  alt="">
          <p class="episode-description"></p>
        </article>
      </template>
   <div class="episode-list"></div>
  </main>
    <script src="episodes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
