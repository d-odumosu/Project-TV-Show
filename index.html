<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TV Show Project | Damilola Odumosu (d-odumosu)</title>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>
<header>
    <div id="header">
        <h1 id="page-title">TV Show Episodes</h1>
    </div>
</header>
<main id="episodes">

<label for="show-select">Select a show:</label>
<select id="show-select">
    <option value="" selected>Select a show</option>
</select>

    <label for="search">search episodes:</label>
    <input type="text"
           id="search"
           name="episode"
           placeholder="enter episode"/>
    <button>search</button>
    <p id="search-count"></p>

    <label for="episode-select">Select an episode:</label>
    <select id="episode-select" name="episode">
        <option value="" selected>Select an episode</option>
    </select>
    <template id="episode-template">
        <article class="episode-card">
            <h3 class="episode-title"></h3>
            <img class="episode-image" alt="">
            <p class="episode-description"></p>
        </article>
    </template>
    <div class="episode-container" id="episode-container">
        <p id="status-message"></p>
    </div>
</main>
<footer>
    <div id="footer">
        <p id="source">
            Episode data originally comes from
            <a href="https://tvmaze.com/">TVMaze.com</a>
        </p>
    </div>
</footer>
<script src="getData.js"></script>
<script src="script.js"></script>
</body>
</html>
